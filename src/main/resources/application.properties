spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/cloud_test
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activity 6: consistent, timestamped Logback output to stdout for cloud log capture.
# The logger name contains the source class; each message contains Class.method.
logging.level.school.gcu.demo=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{0} - %msg%n
