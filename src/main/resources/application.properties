spring.application.name=demo

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:mysql://localhost:3306/cloud_test}
spring.datasource.username=${JDBC_DATABASE_USERNAME:root}
spring.datasource.password=${JDBC_DATABASE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activity 6: timestamped logging to stdout
logging.level.school.gcu.demo=INFO
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{0} - %msg%n