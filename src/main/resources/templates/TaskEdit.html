<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Edit Task</h1>

    <form th:action="@{/tasks/update/{id}(id=${task.id})}"
          th:object="${task}"
          method="post">

        <div class="mb-3">

            <label class="form-label">
                Title
            </label>

            <input type="text"
                   class="form-control"
                   th:field="*{title}"
                   required>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Description
            </label>

            <textarea class="form-control"
                      th:field="*{description}"
                      rows="4">
            </textarea>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Status
            </label>

            <select class="form-select"
                    th:field="*{status}">

                <option value="Not Started">
                    Not Started
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>

        </div>

        <div class="mb-3">

            <label class="form-label">
                Due Date
            </label>

            <input type="date"
                   class="form-control"
                   th:field="*{dueDate}">

        </div>

        <button type="submit"
                class="btn btn-primary">
            Save Changes
        </button>

        <a href="/"
           class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

</body>

</html>
